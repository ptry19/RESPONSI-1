<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tabel 5 Kolom 4 Baris</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #fff;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      background-color: #fff0f5;
      width: 80%;
      height: 300px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    th, td {
      border: 1px solid #e0b7c9;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #f8d7e3;
    }

    tr:hover {
      background-color: #ffe4ee;
    }

    caption {
      margin-bottom: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <table>
    <caption><strong>Data Dummy - 5 Kolom 4 Baris</strong></caption>

    <tr>
      <th>Kolom Benda</th>
      <th>Kolom Hewan</th>
      <th>Kolom Sifat</th>
      <th>Kolom Warna</th>
      <th>Kolom Buah</th>
    </tr>

    <tr>
      <td>Kasur</td>
      <td>Kucing</td>
      <td>Baik</td>
      <td>Merah</td>
      <td>Apel</td>
    </tr>

    <tr>
      <td>Lemari</td>
      <td>Tikus</td>
      <td>Jahat</td>
      <td>Biru</td>
      <td>Pisang</td>
    </tr>

    <tr>
      <td>Anting</td>
      <td>Gajah</td>
      <td>Serakah</td>
      <td>Kuning</td>
      <td>Anggur</td>
    </tr>

    <tr>
      <td>Keyboard</td>
      <td>Kijang</td>
      <td>Kejam</td>
      <td>Hijau</td>
      <td>Melon</td>
    </tr>
  </table>
</body>
</html>
